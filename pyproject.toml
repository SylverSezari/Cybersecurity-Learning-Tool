[project]
name = "cybersecurity-learning-tool"
version = "0.1.0"
description = "A learning tool for cybersecurity"
readme = "README.md"
authors = [
    { name = "Marlon Anderes", email = "marlonsonny.anderes@uzh.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "PyJWT>=2.10.1",
    "pydantic-core==2.46.5",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy>=2.0.53",
]

[project.scripts]
cybersecurity-learning-tool = "cybersecurity_learning_tool:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
