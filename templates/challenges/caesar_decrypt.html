<!doctype html>
<!-- Randomized challenge content loaded inside the sandboxed challenge iframe. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Caesar entschlüsseln</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/exercises.css">
  <script src="/static/js/exercise-theme.js" defer></script>
  <script src="/static/js/exercise-tasks.js?v=8" defer></script>
  <script src="/static/js/randomized-cipher.js?v=2" defer></script>
</head>
<body>
  <main class="lesson">
    <section class="lesson-section">
      <p class="section-label">Zufällige Caesar-Aufgabe</p>
      <h1 id="cipherTaskHeading">Caesar entschlüsseln</h1>
      <div class="task-list">
        <article class="exercise-task" data-solution-index="0">
          <p class="task-story" id="cipherTaskStory">Entschlüssle den Geheimtext mit dem angegebenen Schlüssel.</p>
          <p class="task-prompt">Geheimtext: <strong id="cipherText"></strong></p>
          <p class="task-prompt">Schlüssel: <strong id="cipherKey"></strong></p>
          <div class="task-answer-row">
            <input class="task-answer" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Antwort eingeben">
            <button class="check-answer" type="button" disabled>Prüfen</button>
          </div>
          <p class="task-feedback" role="status" aria-live="polite"></p>
        </article>
      </div>
      <section class="challenge-alphabet-section" aria-labelledby="alphabetTitle">
        <h2 id="alphabetTitle">Alphabetrad</h2>
        <div class="alphabet-tool">
          <div class="alphabet-rows" aria-live="polite">
            <div class="alphabet-row">
              <strong>Schlüssel</strong>
              <div class="alphabet-key-track">
                <input id="caesarShift" type="range" min="0" max="25" value="0" aria-label="Verschiebung im Alphabet">
                <output id="shiftValue" class="alphabet-key-marker" for="caesarShift">0</output>
              </div>
            </div>
            <div class="alphabet-row"><strong>Klartext</strong><output id="plainAlphabet"></output></div>
            <div class="alphabet-row"><strong>Geheimtext</strong><output id="cipherAlphabet"></output></div>
          </div>
        </div>
      </section>
      <p class="tasks-complete" id="tasksComplete" role="status" hidden>Richtig. Du kannst fortfahren.</p>
    </section>
  </main>
</body>
</html>
