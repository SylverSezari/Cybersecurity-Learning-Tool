<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f7fa" />
		<meta
			name="description"
			content="Cybersecurity Learning Tool"
		/>
		<link
			rel="stylesheet"
			href="{{ url_for('static', path='css/main.css') }}"
		/>

		{% if title %}
		<title>{{ title }} | Cybersecurity Learning Tool</title>
		{% else %}
		<title>Cybersecurity Learning Tool</title>
		{% endif %}

	</head>
	<body>
		<header class="site-header">
			<nav class="site-nav" aria-label="Main navigation">
				<a class="brand" href="{{ url_for('home') }}" aria-label="Home">
					<!-- Replace this mark with an image from static/pictures later. -->
					<span class="brand-mark" aria-hidden="true">CLT</span>
					<span class="brand-name">Cybersecurity Learning Tool</span>
				</a>

				<div class="nav-actions">
					<button
						class="icon-button"
						id="themeToggle"
						type="button"
						aria-label="Switch to dark mode"
						title="Switch theme"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
							<circle cx="12" cy="12" r="4" />
						</svg>
					</button>
					<button
						class="icon-button"
						type="button"
						aria-label="Account"
						title="Account"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<circle cx="12" cy="8" r="3.5" />
							<path d="M4.5 20c.7-3.3 3.2-5 7.5-5s6.8 1.7 7.5 5" />
						</svg>
					</button>
				</div>
			</nav>
		</header>

		<main class="page-content">
			{% block content %}{% endblock content %}
		</main>

		<script>
			const themeToggle = document.getElementById("themeToggle");
			const storedTheme = localStorage.getItem("theme");
			const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			const initialTheme = storedTheme || (prefersDark ? "dark" : "light");

			function setTheme(theme) {
				document.documentElement.dataset.theme = theme;
				themeToggle.setAttribute(
					"aria-label",
					theme === "dark" ? "Switch to light mode" : "Switch to dark mode",
				);
				themeToggle.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
				localStorage.setItem("theme", theme);
			}

			setTheme(initialTheme);
			themeToggle.addEventListener("click", () => {
				const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
				setTheme(nextTheme);
			});
		</script>

		{% block scripts %}{% endblock scripts %}
	</body>
</html>
