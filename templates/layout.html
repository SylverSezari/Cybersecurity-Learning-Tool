<!doctype html>
<html lang="de" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f7fa" />
		<meta
			name="description"
			content="Lernplattform für Cybersicherheit"
		/>
		<link
			rel="stylesheet"
			href="{{ url_for('static', path='css/theme.css') }}"
		/>
		<link
			rel="stylesheet"
			href="{{ url_for('static', path='css/main.css') }}?v=3"
		/>
		<script>
			// Avoid flashing protected content while the async session check is pending.
			if (window.location.pathname !== "/login") {
				document.documentElement.dataset.authPending = "true";
			}
		</script>

		{% if title %}
		<title>{{ title }} | Lernplattform für Cybersicherheit</title>
		{% else %}
		<title>Lernplattform für Cybersicherheit</title>
		{% endif %}

	</head>
	<body>
		<header class="site-header">
			<nav class="site-nav" aria-label="Hauptnavigation">
				<a class="brand" href="{{ url_for('home') }}" aria-label="Startseite">
					<!-- Replace this mark with an image from static/pictures later. -->
					<span class="brand-mark" aria-hidden="true">CLT</span>
					<span class="brand-name">Lernplattform für Cybersicherheit</span>
				</a>

				<div class="nav-actions">
					<button class="logout-button" id="userLogoutButton" type="button" hidden>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
						</svg>
						Abmelden
					</button>
					<button
						class="icon-button"
						id="themeToggle"
						type="button"
						aria-label="Zum dunklen Design wechseln"
						title="Design wechseln"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
							<circle cx="12" cy="12" r="4" />
						</svg>
					</button>
					<a
						class="icon-button"
						href="{{ url_for('account_page') }}"
						aria-label="Administrationsverwaltung"
						title="Verwaltung"
					>
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<circle cx="12" cy="8" r="3.5" />
							<path d="M4.5 20c.7-3.3 3.2-5 7.5-5s6.8 1.7 7.5 5" />
						</svg>
					</a>
				</div>
			</nav>
		</header>

		<main class="page-content{% block page_class %}{% endblock page_class %}">
			{% block content %}{% endblock content %}
		</main>

		<script>
			const themeToggle = document.getElementById("themeToggle");
			const storedTheme = localStorage.getItem("theme");
			const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
			const initialTheme = storedTheme || (prefersDark ? "dark" : "light");
			const exerciseFrames = document.querySelectorAll(".exercise-frame");

			// Exercise documents are isolated, so theme changes cross the frame boundary by message.
			function syncExerciseTheme(theme) {
				exerciseFrames.forEach((frame) => {
					frame.contentWindow?.postMessage({ type: "theme-change", theme }, "*");
				});
			}

			exerciseFrames.forEach((frame) => {
				frame.addEventListener("load", () => {
					syncExerciseTheme(document.documentElement.dataset.theme);
				});
			});

			function setTheme(theme) {
				document.documentElement.dataset.theme = theme;
				themeToggle.setAttribute(
					"aria-label",
					theme === "dark" ? "Zum hellen Design wechseln" : "Zum dunklen Design wechseln",
				);
				themeToggle.title = theme === "dark" ? "Zum hellen Design wechseln" : "Zum dunklen Design wechseln";
				localStorage.setItem("theme", theme);
				syncExerciseTheme(theme);
			}

			setTheme(initialTheme);
			themeToggle.addEventListener("click", () => {
				const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
				setTheme(nextTheme);
			});
		</script>
		<script src="{{ url_for('static', path='js/auth-guard.js') }}?v=2"></script>
		<script src="{{ url_for('static', path='js/logout.js') }}"></script>

		{% block scripts %}{% endblock scripts %}
	</body>
</html>
