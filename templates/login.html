{% extends "layout.html" %}

{% block content %}
<section class="login-page" aria-labelledby="login-title">
	<div class="login-copy">
		<p class="section-kicker">Lernplattform für Cybersicherheit</p>
		<h1 id="login-title">Deine nächste Lektion beginnt hier.</h1>
		<p>Melde dich an, um mit dem Lernen zur Cybersicherheit fortzufahren.</p>
	</div>

	<div class="login-panel">
		<h2>Anmelden</h2>
		<form class="login-form" id="loginForm">
			<label for="username">Benutzername</label>
			<input
				id="username"
				name="username"
				autocomplete="username"
				required
				maxlength="20"
			/>

			<label for="password">Passwort</label>
			<input
				id="password"
				name="password"
				type="password"
				autocomplete="current-password"
				required
			/>

			<p class="login-error" id="loginError" role="alert" hidden></p>
			<button class="login-submit" id="loginSubmit" type="submit">
				Anmelden
			</button>
		</form>
	</div>
</section>
{% endblock content %}

{% block scripts %}
<script src="{{ url_for('static', path='js/login.js') }}" defer></script>
{% endblock scripts %}
